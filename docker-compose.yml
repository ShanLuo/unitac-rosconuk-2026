services:
  workshop:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: host
    working_dir: /ros2_ws
    stdin_open: true
    tty: true
    devices:
      - "${GELSIGHT_DEVICE:-/dev/video2}:/dev/video2"
    volumes:
      - ./src:/ros2_ws/src
      - ./test_output:/ros2_ws/test_output
